<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>رفع صور التقييمات</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f5f4f1; --card: #ffffff; --text: #1d1d1f; --muted: #6e6e73; --line: #e7e5e0;
    --accent: #1d1d1f; --accent-text: #ffffff; --soft: #f1efea; --ok: #1f8a4c; --err: #c0392b;
    --radius: 18px; --shadow: 0 1px 2px rgba(0,0,0,.04), 0 10px 30px rgba(0,0,0,.06);
    --shadow-hover: 0 2px 4px rgba(0,0,0,.05), 0 18px 40px rgba(0,0,0,.12);
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#111113; --card:#1c1c1f; --text:#f2f2f2; --muted:#9a9aa0; --line:#2c2c30;
      --accent:#f2f2f2; --accent-text:#111113; --soft:#26262a; --ok:#4cc27e; --err:#ff6b5b;
      --shadow: 0 1px 2px rgba(0,0,0,.3), 0 10px 30px rgba(0,0,0,.35);
      --shadow-hover: 0 2px 4px rgba(0,0,0,.4), 0 18px 40px rgba(0,0,0,.5); }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font-family: 'Cairo', system-ui, sans-serif; line-height: 1.6; }
  .wrap { max-width: 960px; margin: 0 auto; padding: 32px 16px 64px; }
  header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 24px; gap: 12px; }
  h1 { font-size: 24px; margin: 0; font-weight: 700; }
  h2 { font-size: 18px; margin: 0; font-weight: 700; }
  .sub { color: var(--muted); font-size: 14px; margin: 2px 0 0; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); padding: 20px; }
  .step { display: flex; align-items: center; gap: 10px; font-weight: 700; margin-bottom: 14px; }
  .num { width: 26px; height: 26px; border-radius: 50%; background: var(--accent); color: var(--accent-text); display: grid; place-items: center; font-size: 13px; flex: none; }
  .opt { font-weight: 400; font-size: 13px; color: var(--muted); background: var(--soft); padding: 1px 10px; border-radius: 999px; }
  input[type=text], input[type=password] { width: 100%; font: inherit; padding: 12px 14px; border-radius: 12px; border: 1px solid var(--line); background: var(--soft); color: var(--text); outline: none; transition: border-color .15s; }
  input:focus { border-color: var(--text); }
  button { font: inherit; cursor: pointer; border: 0; border-radius: 12px; padding: 12px 18px; font-weight: 600; transition: opacity .15s, transform .05s; }
  button:active { transform: scale(.98); }
  button:disabled { opacity: .4; cursor: not-allowed; }
  .btn { background: var(--accent); color: var(--accent-text); }
  .btn-ghost { background: transparent; color: var(--muted); border: 1px solid var(--line); padding: 8px 14px; font-size: 14px; }
  .full { width: 100%; }
  .hidden { display: none !important; }
  .muted { color: var(--muted); font-size: 14px; }

  /* Upload area: product picker + image side by side on desktop */
  .upload { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 32px; }
  @media (max-width: 720px) { .upload { grid-template-columns: 1fr; } }

  .results { margin-top: 10px; max-height: 280px; overflow-y: auto; }
  .prod { display: flex; align-items: center; gap: 12px; padding: 8px; border-radius: 10px; cursor: pointer; }
  .prod:hover { background: var(--soft); }
  .prod img, .prod .ph { width: 44px; height: 44px; border-radius: 8px; object-fit: cover; background: var(--soft); flex: none; }
  .prod .t { font-weight: 600; font-size: 15px; }
  .prod .h { color: var(--muted); font-size: 12px; direction: ltr; text-align: right; }
  .selected { display: flex; align-items: center; gap: 12px; padding: 10px; border: 2px solid var(--text); border-radius: 12px; }
  .selected img { width: 48px; height: 48px; border-radius: 8px; object-fit: cover; background: var(--soft); flex: none; }
  .selected .grow { flex: 1; min-width: 0; }
  .none-note { margin-top: 12px; padding: 10px 12px; border-radius: 12px; background: var(--soft); font-size: 13px; color: var(--muted); }

  .drop { display: block; border: 2px dashed var(--line); border-radius: 14px; padding: 36px 16px; text-align: center; cursor: pointer; transition: border-color .15s, background .15s; }
  .drop.over, .drop:hover { border-color: var(--text); background: var(--soft); }
  .drop svg { width: 36px; height: 36px; color: var(--muted); }
  .preview { position: relative; border-radius: 14px; overflow: hidden; background: var(--soft); }
  .preview img { width: 100%; height: auto; max-height: 70vh; object-fit: contain; display: block; margin: 0 auto; }
  .preview .change { position: absolute; top: 10px; left: 10px; background: rgba(0,0,0,.6); color: #fff; padding: 6px 12px; font-size: 13px; border-radius: 999px; }
  .msg { margin-top: 12px; font-size: 14px; }
  .msg.ok { color: var(--ok); } .msg.err { color: var(--err); }

  /* Recent cards */
  .row { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 16px; }
  .cards { columns: 4 220px; column-gap: 16px; }
  .cards > * { break-inside: avoid; margin-bottom: 16px; }
  .cards > .empty { column-span: all; }
  .rcard { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; box-shadow: var(--shadow); transition: transform .2s, box-shadow .2s; display: flex; flex-direction: column; width: 100%; }
  .rcard:hover { transform: translateY(-3px); box-shadow: var(--shadow-hover); }
  .rcard .img { display: block; width: 100%; padding: 0; border-radius: 0; background: var(--soft); cursor: zoom-in; }
  .rcard .img img { width: 100%; height: auto; display: block; }
  .rcard .img .processing { aspect-ratio: 4 / 5; display: grid; place-items: center; color: var(--muted); font-size: 13px; cursor: default; }
  .lightbox { position: fixed; inset: 0; z-index: 50; background: rgba(0,0,0,.88); display: flex; align-items: center; justify-content: center; padding: 16px; cursor: zoom-out; }
  .lightbox img { max-width: 100%; max-height: calc(100vh - 80px); object-fit: contain; border-radius: 8px; }
  .lightbox .lb-cap { position: absolute; bottom: 16px; inset-inline: 16px; text-align: center; color: #fff; font-size: 14px; }
  .lightbox .lb-close { position: absolute; top: 12px; left: 12px; width: 40px; height: 40px; padding: 0; border-radius: 50%; background: rgba(255,255,255,.15); color: #fff; font-size: 22px; }
  .rcard .body { display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-top: 1px solid var(--line); }
  .rcard .pimg { width: 34px; height: 34px; border-radius: 8px; object-fit: cover; background: var(--soft); flex: none; }
  .rcard .info { min-width: 0; flex: 1; }
  .rcard .pname { font-weight: 700; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .rcard .pname.none { color: var(--muted); font-weight: 600; }
  .rcard .date { color: var(--muted); font-size: 12px; }
  .rcard.new { outline: 2px solid var(--ok); outline-offset: -2px; }
  .skeleton { width: 100%; background: linear-gradient(90deg, var(--soft) 25%, var(--line) 50%, var(--soft) 75%); background-size: 200% 100%; animation: shimmer 1.2s infinite; border-radius: var(--radius); aspect-ratio: 4 / 5.6; }
  @keyframes shimmer { to { background-position: -200% 0; } }
  .empty { text-align: center; padding: 40px 16px; color: var(--muted); }

  .login { max-width: 380px; margin: 12vh auto 0; }
  .spinner { display: inline-block; width: 14px; height: 14px; border: 2px solid currentColor; border-top-color: transparent; border-radius: 50%; animation: spin .7s linear infinite; vertical-align: -2px; }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<div class="wrap">

  <!-- Login -->
  <div id="loginView" class="card login">
    <h1 style="margin-bottom:4px">رفع صور التقييمات</h1>
    <p class="sub" style="margin-bottom:18px">اكتب كلمة السر عشان تدخل</p>
    <form id="loginForm">
      <input id="pw" type="password" placeholder="كلمة السر" autocomplete="current-password" required>
      <button class="btn full" style="margin-top:12px" type="submit">دخول</button>
      <div id="loginMsg" class="msg err"></div>
    </form>
  </div>

  <!-- App -->
  <div id="appView" class="hidden">
    <header>
      <div>
        <h1>رفع صور التقييمات</h1>
        <p class="sub">الصورة بتتضاف لـ Product Review Images وتظهر في المتجر</p>
      </div>
      <button id="logout" class="btn-ghost">خروج</button>
    </header>

    <div class="upload">
      <section class="card">
        <div class="step"><span class="num">1</span>المنتج <span class="opt">اختياري</span></div>
        <div id="pickBox">
          <input id="search" type="text" placeholder="ابحث باسم المنتج…" autocomplete="off">
          <div id="results" class="results"></div>
        </div>
        <div id="selectedBox" class="selected hidden">
          <img id="selImg" alt="">
          <div class="grow"><div id="selTitle" style="font-weight:700"></div><div id="selHandle" class="muted" style="direction:ltr;text-align:right"></div></div>
          <button id="changeProd" class="btn-ghost">إلغاء</button>
        </div>
        <div id="noneNote" class="none-note">مش لازم تختار منتج — لو سبته فاضي الصورة هتظهر في بوب-أب التقييمات العام بس.</div>
      </section>

      <section class="card">
        <div class="step"><span class="num">2</span>الصورة</div>
        <label id="drop" class="drop">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 16V4m0 0l-4 4m4-4l4 4"/><path d="M4 16v2a2 2 0 002 2h12a2 2 0 002-2v-2"/></svg>
          <div style="font-weight:600;margin-top:6px">اسحب الصورة هنا أو دوس للاختيار</div>
          <div class="muted">صورة واحدة — JPG · PNG · WEBP</div>
          <input id="fileInput" type="file" accept="image/*" hidden>
        </label>
        <div id="preview" class="preview hidden">
          <img id="previewImg" alt="">
          <button id="changeImg" class="change" type="button">تغيير الصورة</button>
        </div>
        <button id="uploadBtn" class="btn full" style="margin-top:16px" disabled>رفع الصورة</button>
        <div id="uploadMsg" class="msg"></div>
      </section>
    </div>

    <section>
      <div class="row">
        <h2>الصور المضافة</h2>
        <button id="refresh" class="btn-ghost">تحديث</button>
      </div>
      <div id="recent" class="cards"></div>
    </section>
  </div>
</div>

<script>
const $ = (id) => document.getElementById(id);
const store = {
  get() { try { return sessionStorage.getItem('kewi_pw') || ''; } catch { return ''; } },
  set(v) { try { v ? sessionStorage.setItem('kewi_pw', v) : sessionStorage.removeItem('kewi_pw'); } catch {} },
};
let password = store.get();
let product = null;
let file = null, fileUrl = null;
let busy = false;
let lastCreatedId = null;

async function api(path, { method = 'GET', body } = {}) {
  const res = await fetch(path, {
    method,
    headers: { 'x-password': password, ...(body ? { 'Content-Type': 'application/json' } : {}) },
    body: body ? JSON.stringify(body) : undefined,
  });
  const data = await res.json().catch(() => ({}));
  if (res.status === 401) { logout(); throw new Error('كلمة السر غلط'); }
  if (!res.ok) throw new Error(data.error || 'حصل خطأ');
  return data;
}
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
const fmtDate = (iso) => { try { return new Date(iso).toLocaleDateString('ar-EG', { day: 'numeric', month: 'long', year: 'numeric' }); } catch { return ''; } };

/* ---------- Auth ---------- */
function showApp() { $('loginView').classList.add('hidden'); $('appView').classList.remove('hidden'); searchProducts(''); loadRecent(); }
function logout() { password = ''; store.set(''); $('appView').classList.add('hidden'); $('loginView').classList.remove('hidden'); }
$('loginForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  password = $('pw').value; $('loginMsg').textContent = '';
  try { await api('/api/login', { method: 'POST', body: {} }); store.set(password); showApp(); }
  catch (err) { $('loginMsg').textContent = err.message; }
});
$('logout').onclick = logout;
if (password) api('/api/login', { method: 'POST', body: {} }).then(showApp).catch(() => {});

/* ---------- Product (optional) ---------- */
let searchTimer, searchSeq = 0;
$('search').addEventListener('input', (e) => { clearTimeout(searchTimer); searchTimer = setTimeout(() => searchProducts(e.target.value), 300); });
async function searchProducts(q) {
  const seq = ++searchSeq;
  $('results').innerHTML = '<div class="muted" style="padding:8px"><span class="spinner"></span> بيدور…</div>';
  try {
    const list = await api('/api/products?q=' + encodeURIComponent(q));
    if (seq !== searchSeq) return;
    $('results').innerHTML = list.length ? list.map((p, i) => `
      <div class="prod" data-i="${i}">
        ${p.image ? `<img src="${esc(p.image)}" alt="">` : '<div class="ph"></div>'}
        <div><div class="t">${esc(p.title)}</div><div class="h">${esc(p.handle)}${p.status !== 'ACTIVE' ? ' · ' + esc(p.status.toLowerCase()) : ''}</div></div>
      </div>`).join('') : '<div class="muted" style="padding:8px">مفيش منتجات بالاسم ده</div>';
    $('results').querySelectorAll('.prod').forEach((el) => el.onclick = () => selectProduct(list[el.dataset.i]));
  } catch (err) { if (seq === searchSeq) $('results').innerHTML = `<div class="msg err">${esc(err.message)}</div>`; }
}
function selectProduct(p) {
  product = p;
  $('selImg').src = p.image || ''; $('selTitle').textContent = p.title; $('selHandle').textContent = p.handle;
  $('pickBox').classList.add('hidden'); $('noneNote').classList.add('hidden'); $('selectedBox').classList.remove('hidden');
}
function clearProduct() {
  product = null;
  $('selectedBox').classList.add('hidden'); $('pickBox').classList.remove('hidden'); $('noneNote').classList.remove('hidden');
}
$('changeProd').onclick = clearProduct;

/* ---------- Single image ---------- */
const drop = $('drop');
['dragenter', 'dragover'].forEach((ev) => drop.addEventListener(ev, (e) => { e.preventDefault(); drop.classList.add('over'); }));
['dragleave', 'drop'].forEach((ev) => drop.addEventListener(ev, (e) => { e.preventDefault(); drop.classList.remove('over'); }));
drop.addEventListener('drop', (e) => setFile(e.dataTransfer.files[0]));
$('fileInput').addEventListener('change', (e) => { setFile(e.target.files[0]); e.target.value = ''; });
$('changeImg').onclick = () => { if (!busy) $('fileInput').click(); };

function setFile(f) {
  if (!f) return;
  if (!f.type.startsWith('image/')) { showMsg('err', 'الملف لازم يكون صورة'); return; }
  if (fileUrl) URL.revokeObjectURL(fileUrl);
  file = f; fileUrl = URL.createObjectURL(f);
  $('previewImg').src = fileUrl;
  drop.classList.add('hidden'); $('preview').classList.remove('hidden');
  showMsg('', ''); $('uploadBtn').disabled = false;
}
function resetFile() {
  if (fileUrl) URL.revokeObjectURL(fileUrl);
  file = null; fileUrl = null;
  $('preview').classList.add('hidden'); drop.classList.remove('hidden');
  $('uploadBtn').disabled = true;
}
function showMsg(type, text) { $('uploadMsg').className = 'msg ' + type; $('uploadMsg').textContent = text; }

$('uploadBtn').onclick = async () => {
  if (!file || busy) return;
  busy = true; $('uploadBtn').disabled = true;
  $('uploadBtn').innerHTML = '<span class="spinner"></span> بيرفع…'; showMsg('', '');
  try {
    const target = await api('/api/staged', { method: 'POST', body: { filename: file.name, mimeType: file.type, fileSize: file.size } });
    const form = new FormData();
    target.parameters.forEach((p) => form.append(p.name, p.value));
    form.append('file', file);
    const up = await fetch(target.url, { method: 'POST', body: form });
    if (!up.ok) throw new Error('فشل رفع الملف لشوبيفاي');
    const result = await api('/api/create', {
      method: 'POST',
      body: { resourceUrl: target.resourceUrl, productId: product?.id || null, alt: product?.title || '' },
    });
    lastCreatedId = result.metaobject?.id || null;
    showMsg('ok', product ? `تمام! الصورة اتضافت لـ «${product.title}»` : 'تمام! الصورة اتضافت بدون منتج');
    resetFile(); clearProduct();
    loadRecent();
  } catch (err) {
    showMsg('err', err.message);
    $('uploadBtn').disabled = false;
  } finally {
    busy = false; $('uploadBtn').textContent = 'رفع الصورة';
    if (!file) $('uploadBtn').disabled = true;
  }
};

/* ---------- Lightbox (full-size image) ---------- */
function openLightbox(src, caption) {
  const lb = document.createElement('div');
  lb.className = 'lightbox';
  lb.innerHTML = `<button class="lb-close" aria-label="إغلاق">×</button><img src="${esc(src)}" alt=""><div class="lb-cap">${esc(caption)}</div>`;
  const close = () => { lb.remove(); document.removeEventListener('keydown', onKey); };
  const onKey = (e) => { if (e.key === 'Escape') close(); };
  lb.onclick = close;
  document.addEventListener('keydown', onKey);
  document.body.appendChild(lb);
}

/* ---------- Recent cards ---------- */
let recentRetries = 0;
$('refresh').onclick = () => { recentRetries = 0; loadRecent(); };
async function loadRecent() {
  if (!$('recent').children.length) $('recent').innerHTML = '<div class="skeleton"></div>'.repeat(4);
  try {
    const list = await api('/api/recent');
    $('recent').innerHTML = list.length ? list.map((r) => `
      <article class="rcard${r.id === lastCreatedId ? ' new' : ''}">
        ${r.image
          ? `<button type="button" class="img" data-full="${esc(r.full || r.image)}" data-cap="${esc(r.product || 'بدون منتج')}"><img src="${esc(r.image)}" alt="${esc(r.product || '')}"${r.width ? ` width="${r.width}" height="${r.height}"` : ''} loading="lazy"></button>`
          : '<div class="img"><div class="processing"><span><span class="spinner"></span> شوبيفاي بيجهّز الصورة…</span></div></div>'}
        <div class="body">
          ${r.productImage ? `<img class="pimg" src="${esc(r.productImage)}" alt="">` : ''}
          <div class="info">
            <div class="pname${r.product ? '' : ' none'}">${r.product ? esc(r.product) : 'بدون منتج'}</div>
            <div class="date">${esc(fmtDate(r.updatedAt))}</div>
          </div>
        </div>
      </article>`).join('') : '<div class="empty card" style="grid-column:1/-1">لسه مفيش صور مضافة</div>';
    $('recent').querySelectorAll('button.img').forEach((b) => b.onclick = () => openLightbox(b.dataset.full, b.dataset.cap));
    // Newly created files take a few seconds to process on Shopify's side.
    if (list.some((r) => !r.image) && recentRetries++ < 5) setTimeout(loadRecent, 4000);
    else if (list.every((r) => r.image)) recentRetries = 0;
  } catch (err) {
    $('recent').innerHTML = `<div class="empty card msg err" style="grid-column:1/-1">${esc(err.message)}</div>`;
  }
}
</script>
</body>
</html>
